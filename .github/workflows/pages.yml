name: Check and publish observatory
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check_math.mjs
      - run: node --check web/assets/app.js && node --check web/assets/scene.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 onnx==1.19.0 onnxruntime==1.22.1
      - run: python tools/export_mlp.py && python tools/export_cnn.py
      - name: Restore deployment-only fonts
        env:
          GRIDNIK_REGULAR: ${{ secrets.GRIDNIK_REGULAR }}
          GRIDNIK_LIGHT: ${{ secrets.GRIDNIK_LIGHT }}
        run: |
          mkdir -p web/fonts
          printf '%s' "$GRIDNIK_REGULAR" | base64 --decode > web/fonts/FoundryGridnik-Regular.woff2
          printf '%s' "$GRIDNIK_LIGHT" | base64 --decode > web/fonts/FoundryGridnik-Light.woff2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
